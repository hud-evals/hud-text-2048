[project]
name = "hud-text-2048-environment"
version = "0.1.0"
description = "Backend service for 2048 game environment"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment"]
